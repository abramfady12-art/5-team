<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرح أخوك الـ5٪ 🔋 Secret Santa</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Lalezar&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f4c95d;--ink:#fdf6e3;--mut:#b4d2c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Cairo',sans-serif;display:flex;justify-content:center;padding:50px 16px 120px;background:#040d14;overflow-x:hidden}
main{width:100%;max-width:480px;position:relative;z-index:2}
.dev-badge{text-align:center;padding:12px;background:rgba(244,201,93,0.15);border:1.5px solid #f4c95d;border-radius:20px;margin-bottom:16px}
.dev-badge span{display:block;font-size:1.2rem;font-weight:900;color:#f4c95d;font-family:'Poppins',sans-serif}
h1{font-family:'Lalezar',sans-serif;font-size:2.8rem;text-align:center;color:#f4c95d;margin:5px 0}
.hype{background:rgba(239,68,68,0.2);border:1.5px solid #f59e0b;border-radius:16px;padding:12px;text-align:center;margin-bottom:16px;font-weight:900}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(244,201,93,0.4);border-radius:24px;padding:20px;margin-bottom:16px}
label{display:block;margin:10px 0 6px;font-weight:700}
select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #f4c95d;background:#06121c;color:#fff;font:inherit}
button{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ffd77a;background:linear-gradient(180deg,#ef4b5b,#b3131f);color:#fff;font-weight:900;font-size:1.1rem;cursor:pointer;margin-top:12px}
button.alt{background:rgba(255,255,255,0.1);color:#a9c4ba;width:auto;padding:8px 16px;font-size:.9rem}
#wheel{margin-top:15px;min-height:100px;display:flex;align-items:center;justify-content:center;font-family:'Lalezar',sans-serif;font-size:2.2rem;color:#f4c95d;background:#0a2230;border:1px solid #f4c95d;border-radius:16px}
.msg{margin-top:10px;text-align:center;color:#f4c95d;font-weight:700}
.tag{display:inline-block;margin:3px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.1);font-size:.85rem}
.tag.ok{background:#f4c95d;color:#000;font-weight:700}
.fab{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:#ef4b5b;color:#fff;font-size:1.4rem;border:none;cursor:pointer;z-index:99}
</style>
</head>
<body>

<button class="fab" id="music">🔔</button>

<main>
  <div class="dev-badge">
    <small style="color:#fff">Coded by</small>
    <span>Software Engineer Ebra 🚀</span>
  </div>

  <h1>🔋 فرح أخوك الـ5٪</h1>
  <div class="hype">⚠️ الفرحة لسه 5%.. لف الرول اشحنها 100% ⚡</div>

  <section class="card">
    <label for="me">انت مين؟</label>
    <select id="me"></select>
    <button id="spin">لف الرول 🎡</button>
    <div id="wheel">؟</div>
    <div class="msg" id="msg"></div>
  </section>

  <div style="text-align:center"><button class="alt" id="adminBtn">⚙️ دخول الأدمن</button></div>

  <section class="card" id="admin" hidden>
    <label for="boys">👦 أسماء الولاد (اسم في كل سطر)</label>
    <textarea id="boys"></textarea>
    <label for="girls">👧 أسماء البنات (اسم في كل سطر)</label>
    <textarea id="girls"></textarea>
    <button id="save">حفظ وبدء من جديد</button>
    <div class="msg" id="amsg"></div>
    <div id="status"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase, ref, onValue, set, runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC9-9B4h1PYPzdOhZRjCor9ZeXsAm1_JL8",
  authDomain: "secret-santa-8c4fa.firebaseapp.com",
  databaseURL: "https://secret-santa-8c4fa-default-rtdb.firebaseio.com",
  projectId: "secret-santa-8c4fa",
  appId: "1:218179764126:web:4abbe5b9a7c62fbfe8608f"
};
const ADMIN_PASS = "1234";

const db = getDatabase(initializeApp(firebaseConfig));
const root = ref(db, "santa");
const $ = id => document.getElementById(id);

// زر الموسيقى والصوت
let ac = null;
$("music").onclick = () => {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(1567.98, ac.currentTime);
  g.gain.setValueAtTime(0.1, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.8);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.85);
  alert("🔔 تم تفعيل الصوت ورنّ الجرس!");
};

let data = {}, busy = false;
const saved = () => { try { return JSON.parse(localStorage.getItem("santa") || "null"); } catch { return null; } };

const allowed = (u, v, g) => u !== v && (g[u] !== "b" || g[v] === "g");
const matchable = (givers, recv, g) => {
  const m = {};
  const go = (u, seen) => {
    for (const v of recv) {
      if (!allowed(u, v, g) || seen[v]) continue;
      seen[v] = 1;
      if (!m[v] || go(m[v], seen)) { m[v] = u; return true; }
    }
    return false;
  };
  return givers.every(u => go(u, {}));
};

function render() {
  const names = data.names || [], done = data.done || {}, g = data.g || {};
  const left = names.filter(n => !done[n]);
  $("me").innerHTML = left.length ? left.map(n => `<option>${n}</option>`).join("") : "<option>— كله لف —</option>";
  $("spin").disabled = busy || !left.length;
  let s = saved();
  if (s && s.round !== data.round) { localStorage.removeItem("santa"); s = null; }
  if (s && !busy) {
    $("wheel").textContent = s.pick;
    $("msg").textContent = `يا ${s.me}، هديتك لـ ${s.pick} 🤫`;
  }
  $("status").innerHTML = names.map(n => `<span class="tag ${done[n] ? "ok" : ""}">${g[n] === "b" ? "👦" : "👧"} ${n} ${done[n] ? "✓" : ""}</span>`).join("");
}
onValue(root, snap => { data = snap.val() || {}; render(); });

$("spin").onclick = async () => {
  const me = $("me").value;
