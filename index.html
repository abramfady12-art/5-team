<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرح أخوك الـ5٪ 🔋 Secret Santa</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Lalezar&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f4c95d;
  --gold-bright:#fff2b2;
  --red:#ef4b5b;
  --red-dark:#9e0b16;
  --green:#10b981;
  --ink:#fdf6e3;
  --mut:#b4d2c7;
  --glass:rgba(10, 26, 38, 0.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:'Cairo',system-ui,sans-serif;
  display:flex;
  justify-content:center;
  padding:64px 16px 150px;
  overflow-x:hidden;
  background:#040d14;
}

/* خلفية الشفق القطبي والنجوم */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(65% 55% at 15% 10%, rgba(16, 125, 98, 0.55), transparent),
    radial-gradient(55% 45% at 88% 20%, rgba(124, 45, 180, 0.35), transparent),
    radial-gradient(75% 60% at 50% 105%, rgba(12, 74, 60, 0.8), transparent),
    linear-gradient(180deg, #040d14 0%, #081e2c 50%, #05131c 100%);
  animation:aurora 16s ease-in-out infinite alternate;
}
@keyframes aurora{
  0%{filter:hue-rotate(0deg) brightness(1)}
  100%{filter:hue-rotate(22deg) brightness(1.18)}
}

main{width:100%;max-width:480px;position:relative;z-index:2}

/* شارة المبرمج إبرام - كبيرة ومبهرة */
.dev-badge{
  position:relative;
  width:100%;
  margin:0 auto 18px;
  padding:14px 20px;
  border-radius:22px;
  background:linear-gradient(135deg, rgba(244,201,93,0.22), rgba(239,75,91,0.16), rgba(16,185,129,0.18));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1.5px solid rgba(255, 224, 130, 0.75);
  box-shadow:0 10px 35px rgba(244, 201, 93, 0.28), inset 0 1px 1px rgba(255,255,255,0.4);
  text-align:center;
  direction:ltr;
  overflow:hidden;
  animation:badgeFloat 4s ease-in-out infinite;
}
.dev-badge::after{
  content:"";
  position:absolute;
  top:-50%;left:-60%;
  width:40%;height:200%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
  transform:rotate(25deg);
  animation:glint 4.5s infinite;
}
@keyframes glint{0%{left:-60%} 40%,100%{left:140%}}
@keyframes badgeFloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}}
.dev-badge .top-txt{
  display:block;
  font-size:.82rem;
  color:#ffe9a8;
  font-weight:700;
  letter-spacing:.5px;
  margin-bottom:2px;
}
.dev-badge .eng-name{
  display:block;
  font-family:'Poppins','Cairo',sans-serif;
  font-size:1.28rem;
  font-weight:900;
  background:linear-gradient(90deg, #fff, #f4c95d, #ffd166, #fff);
  background-size:200% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:shine 4s linear infinite;
  text-shadow:0 2px 15px rgba(244,201,93,0.3);
}

/* الهيرو والعنوان */
.hero{text-align:center;font-size:2.4rem;direction:ltr;position:relative;margin-top:4px}
.hero::before{
  content:"";
  position:absolute;left:50%;top:50%;
  width:260px;height:260px;
  transform:translate(-50%,-50%);
  background:radial-gradient(rgba(244,201,93,0.32), transparent 68%);
  z-index:-1;
}
.hero span{display:inline-block;filter:drop-shadow(0 8px 14px rgba(0,0,0,0.6))}
.hero span:nth-child(2){font-size:4.5rem;margin:0 8px;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(-8deg) scale(1.1)}}

h1{
  font-family:'Lalezar','Cairo',sans-serif;
  font-weight:400;
  font-size:2.95rem;
  line-height:1.15;
  text-align:center;
  margin:4px 0 12px;
  background:linear-gradient(100deg,#fff6cc,#f4c95d 35%,#d98a16 55%,#ffe9a0 75%,#f4c95d);
  background-size:200% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:shine 5s linear infinite;
  filter:drop-shadow(0 5px 18px rgba(244,201,93,0.4));
}
@keyframes shine{to{background-position:200% center}}

/* بانر الفرحة لسه 5% المجنون + البطارية الحية */
.hype-box{
  position:relative;
  background:linear-gradient(135deg, rgba(220, 38, 38, 0.28), rgba(245, 158, 11, 0.22));
  border:1.5px solid rgba(255, 190, 60, 0.7);
  border-radius:20px;
  padding:12px 16px;
  margin:0 0 24px;
  text-align:center;
  box-shadow:0 0 28px rgba(239, 68, 68, 0.35), inset 0 0 15px rgba(255, 200, 80, 0.15);
  animation:hypePulse 2.2s infinite alternate;
}
@keyframes hypePulse{
  0%{box-shadow:0 0 18px rgba(239, 68, 68, 0.3); transform:scale(0.99)}
  100%{box-shadow:0 0 34px rgba(244, 201, 93, 0.55); transform:scale(1.015)}
}
.hype-title{
  font-weight:900;
  font-size:1.08rem;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}
.hype-title .alert-pill{
  background:#ef4444;
  color:#fff;
  font-size:.82rem;
  padding:2px 10px;
  border-radius:99px;
  animation:blinkRed .9s infinite alternate;
  box-shadow:0 0 12px #ef4444;
}
@keyframes blinkRed{from{opacity:.75}to{opacity:1;transform:scale(1.06)}}

/* شكل البطارية */
.battery-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:10px;
  direction:ltr;
}
.battery{
  position:relative;
  width:150px;
  height:26px;
  border:2px solid #ffd166;
  border-radius:8px;
  padding:3px;
  background:rgba(0,0,0,0.5);
  box-shadow:0 0 12px rgba(255, 209, 102, 0.3);
}
.battery::after{
  content:"";
  position:absolute;
  right:-6px;top:6px;
  width:4px;height:10px;
  background:#ffd166;
  border-radius:0 3px 3px 0;
}
.bat-fill{
  height:100%;
  width:5%;
  border-radius:4px;
  background:linear-gradient(90deg, #ff2a2a, #ff6b6b);
  transition:width 0.4s ease, background 0.4s ease;
  box-shadow:0 0 10px #ff2a2a;
  animation:lowBat 1s infinite alternate;
}
.bat-fill.charging{
  background:linear-gradient(90deg, #f59e0b, #fde047);
  box-shadow:0 0 14px #f59e0b;
  animation:none;
}
.bat-fill.full{
  width:100% !important;
  background:linear-gradient(90deg, #059669, #34d399, #a7f3d0);
  box-shadow:0 0 18px #10b981;
  animation:none;
}
@keyframes lowBat{from{opacity:.5}to{opacity:1}}
.bat-pct{
  font-family:'Poppins',sans-serif;
  font-weight:900;
  font-size:.95rem;
  color:#ff6b6b;
  min-width:46px;
  text-align:left;
}
.bat-pct.charging{color:#fde047}
.bat-pct.full{color:#34d399}

/* البطاقات الزجاجية */
.card{
  position:relative;
  background:linear-gradient(165deg, rgba(255,255,255,0.13), rgba(255,255,255,0.04));
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  border:1px solid rgba(244, 201, 93, 0.45);
  border-radius:30px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 24px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.28);
}
.card::before{
  content:"";
  position:absolute;top:0;left:15%;right:15%;height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}
label{display:block;margin:14px 0 8px;font-weight:700;font-size:1.02rem;color:#ffeeb8}
select,textarea{
  width:100%;
  padding:15px 16px;
  border-radius:16px;
  border:1.5px solid rgba(244, 201, 93, 0.5);
  font:inherit;
  font-weight:700;
  background:rgba(5, 16, 26, 0.85);
  color:var(--ink);
  transition:border-color .2s, box-shadow .2s;
}
select:focus,textarea:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 18px rgba(244,201,93,0.3);
}
select{
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:18px 52%,24px 52%;
  background-size:6px 6px;
  background-repeat:no-repeat;
}
option{background:#091f2e;color:#fff}
textarea{min-height:105px;font-weight:400}

/* الأزرار */
button{
  font:inherit;
  font-weight:900;
  font-size:1.12rem;
  border:1.5px solid #ffe08a;
  border-radius:18px;
  padding:15px 20px;
  cursor:pointer;
  background:linear-gradient(180deg, #ff4d5e 0%, #c91424 100%);
  color:#fff;
  width:100%;
  margin-top:16px;
  box-shadow:0 10px 28px rgba(214, 40, 57, 0.55), inset 0 1px 1px rgba(255,255,255,0.5);
  transition:transform .15s, box-shadow .15s, filter .15s;
}
button:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 14px 34px rgba(239, 75, 91, 0.75);
  filter:brightness(1.06);
}
button:active:not(:disabled){transform:translateY(1px)}
button.alt{
  background:rgba(255,255,255,0.08);
  color:var(--mut);
  border:1px solid rgba(255,255,255,0.25);
  width:auto;
  font-size:.88rem;
  padding:10px 18px;
  box-shadow:none;
  font-weight:700;
}
button:disabled{opacity:.45;cursor:not-allowed}

/* عجلة السحب */
#wheel{
  margin-top:20px;
  min-height:122px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Lalezar','Cairo',sans-serif;
  font-size:2.2rem;
  text-align:center;
  color:var(--gold);
  border-radius:22px;
  padding:14px;
  background:radial-gradient(circle at 50% 0%, rgba(20, 110, 88, 0.45), rgba(4, 13, 20, 0.92));
  border:1.5px solid rgba(244, 201, 93, 0.4);
  box-shadow:inset 0 0 35px rgba(0,0,0,0.85);
  transition:all .3s ease;
}
#wheel.spin{
  animation:pulse .22s infinite alternate;
  border-color:#ffd166;
  box-shadow:0 0 35px rgba(244, 201, 93, 0.55), inset 0 0 30px rgba(0,0,0,0.8);
}
#wheel.win{
  background:linear-gradient(120deg, #fff5c0, #f4c95d, #d48c17, #ffe9a0);
  background-size:200% auto;
  animation:pop .65s cubic-bezier(.18,1.25,.4,1), shine 3s linear infinite;
  color:#241400;
  font-size:2.6rem;
  border:2px solid #fff;
  box-shadow:0 0 55px rgba(244, 201, 93, 0.9);
}
@keyframes pulse{to{transform:scale(1.035)}}
@keyframes pop{from{transform:scale(.55);opacity:0}}

.msg{margin-top:14px;color:var(--gold-bright);min-height:1.5em;text-align:center;font-weight:700;font-size:1.05rem;line-height:1.5}
.tag{display:inline-block;margin:4px;padding:6px 13px;border-radius:99px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);font-size:.88rem}
.tag.ok{background:linear-gradient(120deg,#f4c95d,#c98a1b);color:#241400;border-color:#ffe9a0;font-weight:700}

/* الثلوج والأضواء والزينة */
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.snow i{position:absolute;top:-40px;font-style:normal;color:#fff;text-shadow:0 0 8px #fff;opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(360deg)}}
.stars i{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 7px #fff;z-index:-2;animation:tw 2.2s infinite alternate}
.lights{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-around;z-index:6;pointer-events:none;border-top:3px solid #2b1d14}
.lights i{width:10px;height:15px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);animation:tw 1s infinite alternate}
.lights i:nth-child(3n){--c:#ff4d4d}.lights i:nth-child(3n+1){--c:#ffd23f}.lights i:nth-child(3n+2){--c:#4dd2ff;animation-delay:.5s}
@keyframes tw{to{opacity:.3}}

.orn{position:fixed;top:0;z-index:5;pointer-events:none;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite alternate}
.orn::before{content:"";display:block;width:1.5px;height:var(--h);background:rgba(244,201,93,0.65);margin:0 auto}
.orn::after{content:"";display:block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.65),transparent 38%),var(--c);box-shadow:0 6px 14px rgba(0,0,0,0.55),inset -4px -6px 8px rgba(0,0,0,0.35)}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

/* الأرضية الثلجية */
.ground{position:fixed;bottom:0;left:-5%;right:-5%;height:66px;z-index:3;pointer-events:none;background:linear-gradient(#ffffff,#cfe0f2);border-radius:50% 50% 0 0/40px 40px 0 0;box-shadow:0 -8px 35px rgba(255,255,255,0.3)}
.ground b{position:absolute;top:-36px;left:5%;right:5%;display:flex;justify-content:space-around;font-size:2.2rem;font-weight:400;direction:ltr}

/* العناصر الطائرة التفاعلية (تعمل صوت جرس عند الضغط!) */
.roam{
  position:fixed;
  top:0;left:0;
  z-index:8;
  cursor:pointer;
  user-select:none;
  pointer-events:auto;
  filter:drop-shadow(0 0 12px rgba(244,201,93,0.85));
  transition:filter .2s;
}
.roam:hover{filter:drop-shadow(0 0 20px #fff)}
.roam span{
  display:inline-flex;
  align-items:center;
  gap:2px;
  animation:bob 1.2s ease-in-out infinite alternate;
  transition:transform .2s;
}
.roam.ringing span{
  animation:bellShake .45s ease-in-out !important;
}
@keyframes bob{to{translate:0 -9px}}
@keyframes bellShake{
  0%,100%{transform:rotate(0deg) scale(1.25)}
  20%{transform:rotate(22deg) scale(1.3)}
  40%{transform:rotate(-22deg) scale(1.3)}
  60%{transform:rotate(15deg) scale(1.25)}
  80%{transform:rotate(-15deg) scale(1.25)}
}

/* فقاعة تلميح الجرس */
.bell-toast{
  position:fixed;
  z-index:20;
  pointer-events:none;
  background:linear-gradient(135deg,#fff3b0,#f4c95d);
  color:#241400;
  font-weight:900;
  font-size:.85rem;
  padding:5px 12px;
  border-radius:99px;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  animation:toastUp 1.1s forwards ease-out;
}
@keyframes toastUp{
  0%{opacity:0;transform:translateY(8px) scale(.8)}
  20%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-35px) scale(.95)}
}

/* زر الموسيقى */
.fab{
  position:fixed;
  bottom:78px;left:16px;
  z-index:12;
  width:56px;height:56px;
  margin:0;padding:0;
  border-radius:50%;
  font-size:1.55rem;
  display:flex;align-items:center;justify-content:center;
  animation:tw 1.1s infinite alternate;
  box-shadow:0 8px 25px rgba(214,40,57,0.65);
}
.fab.on{
  animation:none;
  background:linear-gradient(180deg, #10b981, #047857);
  border-color:#a7f3d0;
  box-shadow:0 8px 25px rgba(16,185,129,0.6);
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="stars" id="stars"></div>
<div class="lights" id="lights"></div>
<button class="fab" id="music" aria-label="تشغيل أو إيقاف الموسيقى" title="موسيقى الكريسماس">🔇</button>
<div class="ground"><b><span>🎄</span><span>⛄</span><span>🎁</span><span>🎄</span><span>🎅</span><span>🎁</span><span>⛄</span><span>🎄</span></b></div>

<main>
  <!-- شارة المبرمج إبرام الكبيرة -->
  <div class="dev-badge">
    <span class="top-txt">💻 Coded with love, caffeine &amp; zero sleep by</span>
    <span class="eng-name">Software Engineer Ebra 🚀</span>
  </div>

  <div class="hero"><span>🎄</span><span>🎅</span><span>🎄</span></div>
  <h1>🔋 فرح أخوك الـ5٪</h1>

  <!-- قسم الفرحة لسه 5% المجنون + البطارية -->
  <div class="hype-box">
    <div class="hype-title">
      <span class="alert-pill">⚠️ شحن حرج</span>
      <span>الفرحة لسه 5%.. لف الرول اشحنها 100% ⚡</span>
    </div>
    <div class="battery-wrap">
      <div class="battery">
        <div class="bat-fill" id="batFill"></div>
      </div>
      <span class="bat-pct" id="batPct">5%</span>
    </div>
  </div>

  <section class="card">
    <label for="me" style="margin-top:0">انت مين؟ 👇</label>
    <select id="me"></select>
    <button id="spin">لف الرول واشحن الفرحة 🎡⚡</button>
    <div id="wheel">؟</div>
    <div class="msg" id="msg"></div>
  </section>

  <div style="text-align:center"><button class="alt" id="adminBtn">⚙️ دخول الأدمن</button></div>

  <section class="card" id="admin" hidden>
    <label for="boys" style="margin-top:0">👦 أسماء الولاد (اسم في كل سطر)</label>
    <textarea id="boys"></textarea>
    <label for="girls">👧 أسماء البنات (اسم في كل سطر)</label>
    <textarea id="girls"></textarea>
    <button id="save">حفظ وبدء من جديد</button>
    <div class="msg" id="amsg"></div>
    <div id="status"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase, ref, onValue, set, runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ====== إعدادات Firebase والأدمن ======
const firebaseConfig = {
  apiKey: "AIzaSyC9-9B4h1PYPzdOhZRjCor9ZeXsAm1_JL8",
  authDomain: "secret-santa-8c4fa.firebaseapp.com",
  databaseURL: "https://secret-santa-8c4fa-default-rtdb.firebaseio.com",
  projectId: "secret-santa-8c4fa",
  appId: "1:218179764126:web:4abbe5b9a7c62fbfe8608f"
};
const ADMIN_PASS = "1234";
// =====================================

const db = getDatabase(initializeApp(firebaseConfig));
const root = ref(db, "santa");
const $ = id => document.getElementById(id);

$("lights").innerHTML = "<i></i>".repeat(18);
$("stars").innerHTML = Array.from({length: 65}, () => `<i style="left:${Math.random() * 100}%;top:${Math.random() * 70}%;animation-delay:${Math.random() * 2}s"></i>`).join("");
[["3%","#d62839",70,0],["11%","#f4c95d",40,.6],["88%","#2ec4b6",50,.3],["96%","#9b5de5",85,.9]].forEach(([l, c, h, d]) => {
  const e = document.createElement("div");
  e.className = "orn";
  e.style.cssText = `left:${l};--c:${c};--h:${h}px;animation-delay:${d}s`;
  document.body.appendChild(e);
});

const flake = (ch = "❄") => {
  const e = document.createElement("i");
  e.textContent = ch;
  e.style.cssText = `left:${Math.random() * 100}%;font-size:${10 + Math.random() * 16}px;animation-duration:${6 + Math.random() * 8}s;--x:${Math.random() * 80 - 40}px`;
  $("snow").appendChild(e);
  e.onanimationend = () => e.remove();
};
const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
if (!calm) setInterval(flake, 240);
const party = () => { if (!calm) ["🎉","✨","🎁","⭐","🎄","🔔"].forEach((c, k) => { for (let i = 0; i < 8; i++) setTimeout(() => flake(c), (k * 8 + i) * 55); }); };

// ====== محرك الصوت المتطور (موسيقى طويلة متعددة المقاطع + صوت جرس حقيقي) ======
let ac = null, on = false, loopT = null;
const mus = $("music");

const ensureAudio = () => {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
};

// صوت جرس الكريسماس المعدني عند الضغط على الأجراس أو عربة سانتا
function playJingleBellSound(x, y) {
  ensureAudio();
  const now = ac.currentTime;
  // ترددات توافقية تحاكي رنين الجرس المعدني (Sleigh Bell)
  const freqs = [1567.98, 2093.00, 2637.02, 3135.96, 4186.01];
  freqs.forEach((f, idx) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = idx % 2 === 0 ? "sine" : "triangle";
    osc.frequency.setValueAtTime(f + (Math.random() * 18 - 9), now);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.14 / (idx + 1), now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85 - idx * 0.08);
    osc.connect(gain).connect(ac.destination);
    osc.start(now);
    osc.stop(now + 0.9);
  });

  // تأثير بصري وشرارات مكان الضغط
  if (x && y) {
    const msgs = ["رنّ الجرس! 🔔", "Ho Ho Ho! 🎅", "عيد سعيد! ✨", "فرحة +10% 🎁", "جرس الحظ! ⭐"];
    const toast = document.createElement("div");
    toast.className = "bell-toast";
    toast.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    toast.style.left = Math.min(window.innerWidth - 130, Math.max(15, x - 50)) + "px";
    toast.style.top = Math.max(20, y - 30) + "px";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1100);
    ["✨","🔔","⭐"].forEach((c, i) => setTimeout(() => flake(c), i * 50));
  }
}
