<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرح أخوك الـ5٪ 🔋 Secret Santa</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--gold:#f4c95d;--ink:#fdf6e3;--mut:#a9c4ba}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Cairo,system-ui,sans-serif;display:flex;justify-content:center;padding:70px 16px 150px;overflow-x:hidden;background:#06121c}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 50% at 20% 10%,#14634f88,#0000),radial-gradient(50% 40% at 85% 25%,#5b2a8c55,#0000),radial-gradient(70% 60% at 50% 110%,#0c3b30,#0000),linear-gradient(#06121c,#0a2230);animation:aur 18s ease-in-out infinite alternate}
@keyframes aur{to{filter:hue-rotate(25deg) brightness(1.2)}}
main{width:100%;max-width:460px;position:relative;z-index:1}
h1{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:2.7rem;line-height:1.2;text-align:center;margin:6px 0 2px;background:linear-gradient(100deg,#fff1b8,#f4c95d 35%,#c98a1b 55%,#ffe9a0 75%,#f4c95d);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 4px 14px #f4c95d44)}
@keyframes shine{to{background-position:200% center}}
.sub{text-align:center;color:var(--mut);margin:0 0 26px;font-size:.98rem}
.card{position:relative;background:linear-gradient(160deg,#ffffff1c,#ffffff08);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid #f4c95d55;border-radius:28px;padding:22px;margin-bottom:18px;box-shadow:0 20px 50px #0008,inset 0 1px 0 #ffffff33,0 0 40px #f4c95d1a}
.card::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:linear-gradient(90deg,#0000,var(--gold),#0000)}
label{display:block;margin:12px 0 8px;font-weight:700}
select,textarea{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #f4c95d66;font:inherit;background:#06121ccc;color:var(--ink)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,#0000 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,#0000 50%);background-position:18px 52%,24px 52%;background-size:6px 6px;background-repeat:no-repeat}
option{background:#0a2230}
textarea{min-height:100px}
button{font:inherit;font-weight:900;font-size:1.05rem;border:1px solid #ffd77a;border-radius:16px;padding:14px 18px;cursor:pointer;background:linear-gradient(180deg,#ef4b5b,#b3131f);color:#fff;width:100%;margin-top:14px;box-shadow:0 8px 24px #d6283966,inset 0 1px 0 #ffffff55;transition:transform .15s,box-shadow .15s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px #d6283988}
button.alt{background:#ffffff0d;color:var(--mut);border:1px solid #ffffff33;width:auto;font-size:.85rem;box-shadow:none;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold)}
#wheel{margin-top:18px;min-height:110px;display:flex;align-items:center;justify-content:center;font-family:Lalezar,Cairo,sans-serif;font-size:2rem;text-align:center;color:var(--gold);border-radius:20px;padding:10px;background:radial-gradient(circle at 50% 0,#14634f66,#06121c);border:1px solid #f4c95d44;box-shadow:inset 0 0 30px #0008}
#wheel.spin{animation:pulse .25s infinite alternate;box-shadow:0 0 30px #f4c95d66,inset 0 0 30px #0008}
#wheel.win{background:linear-gradient(120deg,#fff1b8,#f4c95d,#c98a1b,#ffe9a0);background-size:200% auto;animation:pop .6s,shine 3s linear infinite;color:#2a1a00;font-size:2.4rem;box-shadow:0 0 50px #f4c95dbb}
@keyframes pulse{to{transform:scale(1.04)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.msg{margin-top:12px;color:var(--gold);min-height:1.4em;text-align:center;font-weight:700}
.tag{display:inline-block;margin:4px;padding:5px 12px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff22;font-size:.88rem}
.tag.ok{background:linear-gradient(120deg,#f4c95d,#c98a1b);color:#2a1a00;border-color:#ffe9a0}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.snow i{position:absolute;top:-40px;font-style:normal;color:#fff;text-shadow:0 0 6px #fff;opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(360deg)}}
.stars i{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;z-index:-1;animation:tw 2s infinite alternate}
.lights{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-around;z-index:5;pointer-events:none;border-top:3px solid #2b1d14}
.lights i{width:9px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:tw 1s infinite alternate}
.lights i:nth-child(3n){--c:#ff4d4d}.lights i:nth-child(3n+1){--c:#ffd23f}.lights i:nth-child(3n+2){--c:#4dd2ff;animation-delay:.5s}
@keyframes tw{to{opacity:.3}}
.orn{position:fixed;top:0;z-index:4;pointer-events:none;transform-origin:50% 0;animation:swing 3s ease-in-out infinite alternate}
.orn::before{content:"";display:block;width:1px;height:var(--h);background:#f4c95d99;margin:0 auto}
.orn::after{content:"";display:block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,#0000 35%),var(--c);box-shadow:0 6px 14px #0008,inset -4px -6px 8px #0005}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.ground{position:fixed;bottom:0;left:-5%;right:-5%;height:64px;z-index:2;pointer-events:none;background:linear-gradient(#fff,#cfe0f2);border-radius:50% 50% 0 0/40px 40px 0 0;box-shadow:0 -6px 30px #ffffff44}
.ground b{position:absolute;top:-36px;left:5%;right:5%;display:flex;justify-content:space-around;font-size:2.2rem;font-weight:400;direction:ltr}
.hero{text-align:center;font-size:2.2rem;direction:ltr;position:relative}
.hero::before{content:"";position:absolute;left:50%;top:50%;width:240px;height:240px;transform:translate(-50%,-50%);background:radial-gradient(#f4c95d44,#0000 65%);z-index:-1}
.hero span{display:inline-block;filter:drop-shadow(0 6px 10px #0008)}
.hero span:nth-child(2){font-size:4.2rem;margin:0 6px;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(-8deg) scale(1.08)}}
.by{width:fit-content;max-width:100%;margin:0 auto 14px;padding:8px 18px;border-radius:18px;background:linear-gradient(120deg,#f4c95d26,#ffffff10);border:1px solid #f4c95d77;color:var(--gold);font-size:.82rem;font-weight:700;direction:ltr;text-align:center;box-shadow:0 0 22px #f4c95d33}
.roam{position:fixed;top:0;left:0;z-index:3;pointer-events:none;filter:drop-shadow(0 0 8px #f4c95d99)}
.roam span{display:inline-block;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -8px}}
.fab{position:fixed;bottom:78px;left:14px;z-index:10;width:52px;height:52px;margin:0;padding:0;border-radius:50%;font-size:1.5rem;animation:tw 1s infinite alternate}
.fab.on{animation:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="stars" id="stars"></div>
<div class="lights" id="lights"></div>
<button class="fab" id="music" aria-label="موسيقى">🔇</button>
<div class="ground"><b><span>🎄</span><span>⛄</span><span>🎁</span><span>🎄</span><span>🎅</span><span>🎁</span><span>⛄</span><span>🎄</span></b></div>
<main>
  <div class="by">💻 Coded with love, caffeine &amp; zero sleep by Software Engineer Ebra</div>
  <div class="hero"><span>🎄</span><span>🎅</span><span>🎄</span></div>
  <h1>🔋 فرح أخوك الـ5٪</h1>
  <p class="sub">Secret Santa 🎄 الفرحة لسه 5٪.. لف الرول عشان توصل 100٪</p>

  <section class="card">
    <label for="me" style="margin-top:0">انت مين؟</label>
    <select id="me"></select>
    <button id="spin">لف الرول 🎡</button>
    <div id="wheel">؟</div>
    <div class="msg" id="msg"></div>
  </section>

  <div style="text-align:center"><button class="alt" id="adminBtn">دخول الأدمن</button></div>

  <section class="card" id="admin" hidden>
    <label for="boys" style="margin-top:0">👦 أسماء الولاد (اسم في كل سطر)</label>
    <textarea id="boys"></textarea>
    <label for="girls">👧 أسماء البنات (اسم في كل سطر)</label>
    <textarea id="girls"></textarea>
    <button id="save">حفظ وبدء من جديد</button>
    <div class="msg" id="amsg"></div>
    <div id="status"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase, ref, onValue, set, runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ====== عدّل هنا ======
const firebaseConfig = {
  apiKey: "AIzaSyC9-9B4h1PYPzdOhZRjCor9ZeXsAm1_JL8",
  authDomain: "secret-santa-8c4fa.firebaseapp.com",
  databaseURL: "https://secret-santa-8c4fa-default-rtdb.firebaseio.com",
  projectId: "secret-santa-8c4fa",
  appId: "1:218179764126:web:4abbe5b9a7c62fbfe8608f"
};
const ADMIN_PASS = "1234";
// ======================

const db = getDatabase(initializeApp(firebaseConfig));
const root = ref(db, "santa");
const $ = id => document.getElementById(id);
$("lights").innerHTML = "<i></i>".repeat(18);
$("stars").innerHTML = Array.from({length: 60}, () => `<i style="left:${Math.random() * 100}%;top:${Math.random() * 70}%;animation-delay:${Math.random() * 2}s"></i>`).join("");
[["3%","#d62839",70,0],["11%","#f4c95d",40,.6],["88%","#2ec4b6",50,.3],["96%","#9b5de5",85,.9]].forEach(([l, c, h, d]) => {
  const e = document.createElement("div");
  e.className = "orn";
  e.style.cssText = `left:${l};--c:${c};--h:${h}px;animation-delay:${d}s`;
  document.body.appendChild(e);
});
const flake = (ch = "❄") => {
  const e = document.createElement("i");
  e.textContent = ch;
  e.style.cssText = `left:${Math.random() * 100}%;font-size:${10 + Math.random() * 16}px;animation-duration:${6 + Math.random() * 8}s;--x:${Math.random() * 80 - 40}px`;
  $("snow").appendChild(e);
  e.onanimationend = () => e.remove();
};
const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
if (!calm) setInterval(flake, 250);
const party = () => { if (!calm) ["🎉","✨","🎁","⭐","🎄"].forEach((c, k) => { for (let i = 0; i < 8; i++) setTimeout(() => flake(c), (k * 8 + i) * 60); }); };
[["🎅",2.8],["🦌",2.1],["🦌",1.8],["🦌",2.3]].forEach(([ch, sz], k) => {
  const o = document.createElement("div"), i = document.createElement("span");
  i.textContent = ch; i.style.fontSize = sz + "rem"; i.style.animationDelay = k * .3 + "s";
  o.className = "roam"; o.appendChild(i); document.body.appendChild(o);
  let x = Math.random() * (innerWidth - 60);
  o.style.transform = `translate(${x}px,${60 + Math.random() * (innerHeight - 200)}px)`;
  const go = () => {
    const nx = Math.random() * (innerWidth - 60), ny = 50 + Math.random() * (innerHeight - 190), t = 5 + Math.random() * 6;
    o.style.transition = `transform ${t}s ease-in-out`;
    o.style.transform = `translate(${nx}px,${ny}px)`;
    if (ch === "🦌") i.style.transform = nx > x ? "scaleX(-1)" : "none";
    x = nx;
    setTimeout(go, t * 1000);
  };
  if (!calm) setTimeout(go, 100 + k * 500);
});
// موسيقى Jingle Bells (لحن قديم متاح للجميع) بتتولد من المتصفح مباشرة
const mus = $("music"), HZ = {C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392};
const tune = "E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4 F1 F1 F1.5 F.5 F1 E1 E1 E.5 E.5 E1 D1 D1 E1 D2 G2".split(" ");
let ac, on = false, loopT;
const playLoop = () => {
  let t = ac.currentTime + .05;
  tune.forEach(tok => {
    const f = HZ[tok[0]], d = parseFloat(tok.slice(1)) * .34;
    [[f, "triangle", .5], [f * 2, "sine", .25]].forEach(([fr, ty, v]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = ty; o.frequency.value = fr;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(v * .18, t + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + d * .95);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + d);
    });
    t += d;
  });
  loopT = setTimeout(playLoop, (t - ac.currentTime + 1.2) * 1000);
};
const toggle = () => {
  on = !on;
  if (on) { ac = new (window.AudioContext || window.webkitAudioContext)(); playLoop(); }
  else { clearTimeout(loopT); ac.close(); }
  mus.textContent = on ? "🔔" : "🔇";
  mus.classList.toggle("on", on);
};
mus.onclick = toggle;
addEventListener("pointerdown", e => { if (!on && !e.target.closest("#music")) toggle(); }, {once: true});
let data = {}, busy = false;
const saved = () => { try { return JSON.parse(localStorage.getItem("santa") || "null"); } catch { return null; } };

// الولد ياخد بنت بس، والبنت ياخد أي حد غير نفسها
const allowed = (u, v, g) => u !== v && (g[u] !== "b" || g[v] === "g");
// يتأكد إن لسه فيه توزيع ممكن لباقي الناس (عشان محدش يعلق في الآخر)
const matchable = (givers, recv, g) => {
  const m = {};
  const go = (u, seen) => {
    for (const v of recv) {
      if (!allowed(u, v, g) || seen[v]) continue;
      seen[v] = 1;
      if (!m[v] || go(m[v], seen)) { m[v] = u; return true; }
    }
    return false;
  };
  return givers.every(u => go(u, {}));
};

function render() {
  const names = data.names || [], done = data.done || {}, g = data.g || {};
  const left = names.filter(n => !done[n]);
  $("me").innerHTML = left.length ? left.map(n => `<option>${n}</option>`).join("") : "<option>— كله لف —</option>";
  $("spin").disabled = busy || !left.length;
  let s = saved();
  if (s && s.round !== data.round) {
    localStorage.removeItem("santa"); s = null;
    $("wheel").className = ""; $("wheel").textContent = "؟"; $("msg").textContent = "";
  }
  if (s && !busy) {
    $("wheel").className = "win";
    $("wheel").textContent = s.pick;
    $("msg").textContent = `يا ${s.me}، هديتك لـ ${s.pick} 🤫 متقولش لحد!`;
  }
  $("status").innerHTML = names.map(n => `<span class="tag ${done[n] ? "ok" : ""}">${g[n] === "b" ? "👦" : "👧"} ${n} ${done[n] ? "✓" : ""}</span>`).join("");
}
onValue(root, snap => { data = snap.val() || {}; render(); });

$("spin").onclick = async () => {
  const me = $("me").value;
  if (!me || busy) return;
  busy = true; $("spin").disabled = true; $("msg").textContent = "";
  const g0 = data.g || {};
  const pool = (data.pool || []).filter(n => allowed(me, n, g0));
  const w = $("wheel"); w.className = "spin";
  const timer = setInterval(() => { w.textContent = pool[Math.floor(Math.random() * pool.length)] || "؟"; }, 90);
  try {
    const [res] = await Promise.all([
      runTransaction(root, d => {
        if (!d) return d;
        const p = d.pool || [], done = d.done || {}, g = d.g || {};
        if (done[me]) return;
        const rest = (d.names || []).filter(n => !done[n] && n !== me);
        const opts = p.filter(v => allowed(me, v, g) && matchable(rest, p.filter(x => x !== v), g));
        if (!opts.length) return;
        const pick = opts[Math.floor(Math.random() * opts.length)];
        d.pool = p.filter(n => n !== pick);
        d.done = {...done, [me]: true};
        d.results = {...(d.results || {}), [me]: pick};
        return d;
      }),
      new Promise(r => setTimeout(r, 2500))
    ]);
    clearInterval(timer);
    if (res.committed) {
      party();
      localStorage.setItem("santa", JSON.stringify({me, pick: res.snapshot.val().results[me], round: res.snapshot.val().round}));
    } else {
      w.className = ""; w.textContent = "؟";
      $("msg").textContent = "مقدرناش نسحب لك اسم. كلم الأدمن.";
    }
  } catch (e) {
    clearInterval(timer); w.className = ""; w.textContent = "؟";
    $("msg").textContent = "حصل خطأ في الاتصال، جرب تاني.";
  }
  busy = false; render();
};

$("adminBtn").onclick = () => {
  if (prompt("باسورد الأدمن:") === ADMIN_PASS) {
    $("admin").hidden = false;
    const names = data.names || [], g = data.g || {};
    $("boys").value = names.filter(n => g[n] === "b").join("\n");
    $("girls").value = names.filter(n => g[n] !== "b").join("\n");
  }
};

const clean = t => [...new Set(t.split("\n").map(n => n.replace(/[.$#\[\]\/]/g, "").trim()).filter(Boolean))];
$("save").onclick = async () => {
  const boys = clean($("boys").value);
  const girls = clean($("girls").value).filter(n => !boys.includes(n));
  const names = [...boys, ...girls], g = {};
  boys.forEach(n => g[n] = "b"); girls.forEach(n => g[n] = "g");
  if (names.length < 2 || !matchable(names, names, g)) {
    $("amsg").textContent = "التوزيع مش ممكن: لازم عدد البنات يساوي عدد الولاد أو يزيد عليه.";
    return;
  }
  if (!confirm("ده هيمسح أي سحب قديم. متأكد؟")) return;
  await set(root, {names, g, pool: names, done: {}, round: Date.now()});
  localStorage.removeItem("santa");
  $("wheel").className = ""; $("wheel").textContent = "؟"; $("msg").textContent = "";
  $("amsg").textContent = "تم الحفظ ✅";
};
</script>
</body>
</html>
