[["3%","#d62839",70,0],["11%","#f4c95d",40,.6],["88%","#2ec4b6",50,.3],["96%","#9b5de5",85,.9]].forEach(([l, c, h, d]) => {

// ====== الموسيقى (Jingle Bells، لحن قديم متاح للجميع) ======
const mus = $("music"), HZ = {C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392};

  let t = ac.currentTime + .05;
  tune.forEach(tok => {
    const f = HZ[tok[0]], d = parseFloat(tok.slice(1)) * .34;

let data = {}, busy = false, ready = false, failed = false, FB = null, db = null, root = null;

// ====== الأكواد ======
// SHA-256: بنستخدم المتصفح لو متاح، وإلا نسخة JS (عشان crypto.subtle مش بتشتغل على http)
function sha256js(msg) {
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  const primes = []; for (let c = 2; primes.length < 64; c++) if (primes.every(p => c % p)) primes.push(c);
  const frac = x => Math.floor((x - Math.floor(x)) * 4294967296);
  const K = primes.map(p => frac(Math.cbrt(p)));
  let H = primes.slice(0, 8).map(p => frac(Math.sqrt(p)));
  const bytes = Array.from(new TextEncoder().encode(msg));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 255);
  for (let o = 0; o < bytes.length; o += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = (bytes[o + 4 * i] << 24 | bytes[o + 4 * i + 1] << 16 | bytes[o + 4 * i + 2] << 8 | bytes[o + 4 * i + 3]) | 0;
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = H.map((v, i) => (v + [a, b, c, d, e, f, g, h][i]) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}
const sha = async t => {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));

  } catch {}
  return sha256js(t);
};
const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const genCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => ALPHA[b % ALPHA.length]).join("");
async function makeCodes(names) {
  const codes = {}, used = new Set(), h = {};
  for (const n of names) {
    let c; do { c = genCode(); } while (used.has(c));
    used.add(c); codes[n] = c; h[n] = await sha(c);
  }
  return {codes, h};
}

// الولد ياخد بنت بس، والبنت ياخد أي حد غير نفسها

const matchable = (givers, recv, g) => {
  const m = {};
  const go = (u, seen) => {
    for (const v of recv) {
      if (!allowed(u, v, g) || seen[v]) continue;
      seen[v] = 1;
      if (!m[v] || go(m[v], seen)) { m[v] = u; return true; }
    }
    return false;
  };
  return givers.every(u => go(u, {}));
};

        $("msg").textContent = `يا ${s.me}، هديتك لـ ${res} 🤫 متقولش لحد!`;
      } else {
        $("wheel").className = ""; $("wheel").textContent = "؟"; $("msg").textContent = "";
      }
    }
    $("spin").disabled = busy || !ready || !!done[s.me];
  }
  $("status").innerHTML = names.map(n => `<span class="tag ${done[n] ? "ok" : ""}">${g[n] === "b" ? "👦" : "👧"} ${esc(n)} ${done[n] ? "✓" : ""}</span>`).join("");
  if (!$("admin").hidden) showCodes();
}
